# Temporary HTTP-only vhost for first Let's Encrypt issuance (oradent.uz + www)
# Replace with oradent.uz.conf after the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name oradent.uz www.oradent.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        default_type text/plain;
        return 200 'oradent cert pending';
    }
}
