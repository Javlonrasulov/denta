# Legacy DENTA domain → oradent.uz (apply only after oradent.uz passes smoke tests)
# Install over /etc/nginx/sites-available/denta. Keeps ACME so the old cert can renew.
server {
    listen 80;
    listen [::]:80;
    server_name denta.taomim.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://oradent.uz$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name denta.taomim.uz;

    ssl_certificate /etc/letsencrypt/live/denta.taomim.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denta.taomim.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://oradent.uz$request_uri;
}
