# DENTA isolated vhost — do not modify TAOMIM server blocks
# Install: /etc/nginx/sites-available/denta → symlink sites-enabled

# HTTP → HTTPS + ACME
server {
    listen 80;
    listen [::]:80;
    server_name denta.taomim.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name denta.taomim.uz;

    ssl_certificate /etc/letsencrypt/live/denta.taomim.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/denta.taomim.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 10m;

    # NestJS API + Swagger (/api/v1, /api/docs)
    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8091;
        proxy_read_timeout 60s;
    }

    # Local upload assets served by API
    location ^~ /uploads/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8091;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Socket.IO (namespace /realtime uses /socket.io path)
    location ^~ /socket.io/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8091;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Clinic CRM (Next.js)
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 60s;
    }
}
