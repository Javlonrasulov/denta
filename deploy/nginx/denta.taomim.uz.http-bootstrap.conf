# Temporary HTTP-only vhost for ACME before SSL cert exists
server {
    listen 80;
    listen [::]:80;
    server_name denta.taomim.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 200 'denta cert pending';
        add_header Content-Type text/plain;
    }
}
