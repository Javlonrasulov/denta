# Catch-all for hostnames without an explicit vhost (e.g. retired domains still pointing here).
# Install: /etc/nginx/sites-available/000-default-reject → symlink sites-enabled
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_reject_handshake on;
}
